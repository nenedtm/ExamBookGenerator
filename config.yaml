output:
  language: "en"
  filename: "Exam_Manual.md"

llm:
  host: "http://127.0.0.1:11434"
  model: "qwen3:latest"
  timeout: 2700
  max_retries: 2

structure:
  include_toc: true

syllabus:
  enabled: "auto"
  path: null

generation:
  depth_level: 5
  length_mode: "topic_driven"
  scope: "full"
  focus_topic: null
  focus_depth_level: null

images:
  extract: true
  match_to_chapters: true
  vision_model: "llava"
  assets_dir: "output/assets/images"

logging:
  level: "INFO"
  file: "output/logs/exam_book_generator.log"
